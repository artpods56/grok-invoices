[project]
name = "grok-invoices"
version = "0.1.0"
description = "Grok Invoices: first of its kind Agent as a Service"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "fastmcp>=4.1.6",
    "ksef2>=1.3.0",
    "pydantic-settings>=2.6",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/grok_invoices"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
addopts = "-m 'not live'"
markers = ["live: calls KSeF TEST over the network (run with: uv run pytest -m live)"]
