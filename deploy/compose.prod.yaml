# Installed root-owned on the server by install.sh, not read from each release,
# so a pushed commit cannot change mounts or privileges on the shared host.
name: grok-invoices

services:
  app:
    image: grok-invoices:${RELEASE:?RELEASE is required}
    restart: unless-stopped
    init: true
    env_file:
      - /srv/grok-invoices/.env
    environment:
      RELEASE: ${RELEASE}
      DATA_DIR: /data
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - data:/data
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  data:
